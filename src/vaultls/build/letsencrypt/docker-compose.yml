x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"
services:
  vaultls:
    image: ${IMAGE:-ghcr.io/7ritn/vaultls:latest}
    container_name: vaultls
    restart: unless-stopped
    volumes:
      - vaultls-data:/app/data
    logging: *default-logging
    environment:
      VAULTLS_API_SECRET: ${VAULTLS_API_SECRET}
      VAULTLS_DB_SECRET: ${VAULTLS_DB_SECRET:-}
      VAULTLS_URL: ${VAULTLS_URL:-https://${VIRTUAL_HOST}}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-80}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - vaultls-network
      - letsencrypt-network
volumes:
  vaultls-data:
    name: vaultls-data
networks:
  vaultls-network:
    name: vaultls-network
  letsencrypt-network:
    external: true
